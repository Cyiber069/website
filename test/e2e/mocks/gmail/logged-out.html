<!doctype html>
<!-- Mock of the page a signed out browser gets instead of the inbox. -->
<html lang="en">
<head><meta charset="utf-8"><title>Gmail</title></head>
<body>
<h1>Sign in</h1>
<p>to continue to Gmail</p>
<form action="https://accounts.google.com/v3/signin/identifier" method="post" onsubmit="return false">
  <input type="email" id="identifierId" name="identifier" autocomplete="username" aria-label="Email or phone">
  <button type="submit">Next</button>
</form>
</body>
</html>
