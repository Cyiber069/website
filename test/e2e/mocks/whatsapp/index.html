<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhatsApp</title>
<!-- Mock of WhatsApp Web for the extension's end to end tests. See src/app.js. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111b21; background: #f0f2f5; }
  #app { display: flex; height: 100vh; }
  .landing { margin: auto; text-align: center; display: grid; gap: 12px; }
  #side { width: 380px; background: #fff; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; }
  #side header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; }
  #side h1 { font-size: 20px; margin: 0; }
  #side input { width: calc(100% - 24px); margin: 0 12px 8px; padding: 8px 12px; border: 0; border-radius: 16px; background: #f0f2f5; }
  .filters { display: flex; gap: 6px; padding: 0 12px 8px; }
  .filters button { border: 0; border-radius: 14px; padding: 4px 10px; background: #f0f2f5; }
  .filters button[aria-selected="true"] { background: #d9fdd3; }
  #pane-side { flex: 1; overflow-y: auto; }
  .archived { display: flex; gap: 12px; width: 100%; border: 0; background: none; padding: 12px 16px; }
  [role="grid"] { position: relative; }
  [role="grid"] > [role="row"] { position: absolute; left: 0; right: 0; top: 0; height: 72px; }
  .activator[aria-selected="true"] { background: #f0f2f5; }
  .cell { display: grid; grid-template-columns: 48px 1fr auto; grid-template-rows: 1fr 1fr; column-gap: 12px; height: 72px; padding: 10px 16px; align-items: center; cursor: pointer; }
  .cell > .avatar, .cell > .ico:first-child { grid-row: 1 / 3; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #dfe5e7; display: inline-block; }
  .title { font-size: 16px; overflow: hidden; white-space: nowrap; }
  .time { font-size: 12px; color: #667781; }
  .preview { color: #667781; overflow: hidden; white-space: nowrap; }
  .badge { background: #25d366; color: #fff; border-radius: 10px; padding: 0 6px; font-size: 12px; justify-self: end; }
  .draft { color: #00a884; }
  .ico { display: inline-block; width: 14px; height: 14px; vertical-align: middle; }
  .intro { flex: 1; display: grid; place-content: center; text-align: center; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: #f0f2f5; }
  .who { display: grid; }
  .sub { font-size: 12px; color: #667781; }
  .messages { flex: 1; overflow-y: auto; padding: 12px 48px; background: #efeae2; }
  .divider { text-align: center; font-size: 12px; color: #54656f; margin: 8px 0; }
  .bubble { position: relative; max-width: 65%; width: fit-content; margin: 2px 0; padding: 6px 8px; border-radius: 8px; background: #fff; }
  .bubble.me { margin-left: auto; background: #d9fdd3; }
  .tail { position: absolute; top: 0; width: 8px; height: 12px; }
  .bubble.them .tail { left: -8px; } .bubble.me .tail { right: -8px; }
  .quoted { border-left: 4px solid #06cf9c; background: rgba(0,0,0,.05); padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; }
  .author { display: block; font-weight: 600; font-size: 12px; }
  .media img { width: 120px; height: 80px; background: #cfd8dc; display: block; }
  .meta { display: flex; gap: 4px; justify-content: flex-end; font-size: 11px; color: #667781; }
  .emoji { width: 18px; height: 18px; vertical-align: -4px; }
  footer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 16px; background: #f0f2f5; }
  .lexical-rich-text-input { flex: 1; background: #fff; border-radius: 8px; }
  .composer { min-height: 40px; max-height: 120px; overflow-y: auto; padding: 9px 12px; outline: none; }
  .composer p { margin: 0; }
  footer button { height: 40px; min-width: 40px; border: 0; border-radius: 50%; background: #fff; }
  .dialog-layer { position: fixed; inset: 0; background: rgba(11,20,26,.6); display: grid; place-content: center; z-index: 10; }
  .dialog { background: #fff; padding: 24px; border-radius: 8px; max-width: 420px; display: grid; gap: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.bundle.js"></script>
</body>
</html>
