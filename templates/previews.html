<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game template options</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #07080f; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #eef0f7; padding: 24px; display: grid; gap: 28px; justify-content: center; }
  .card { width: 1600px; height: 900px; border-radius: 28px; overflow: hidden; position: relative; display: grid; grid-template-columns: 1010px 1fr;
    background: radial-gradient(900px 600px at 0% 0%, color-mix(in srgb, var(--c) 30%, transparent), transparent 65%), radial-gradient(700px 500px at 100% 100%, color-mix(in srgb, var(--c2) 24%, transparent), transparent 60%), linear-gradient(160deg, #15162e, #0a0b18); border: 1px solid #ffffff22; }
  .left { padding: 34px 0 30px 38px; display: flex; flex-direction: column; gap: 18px; }
  .tag { display: flex; align-items: center; gap: 14px; }
  .num { font-size: 21px; font-weight: 900; letter-spacing: .14em; padding: 8px 18px; border-radius: 999px; color: #10101c; background: linear-gradient(100deg, var(--c), var(--c2)); box-shadow: 0 0 28px color-mix(in srgb, var(--c) 60%, transparent); }
  .genre { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #c9cdea; border: 1px solid #ffffff33; padding: 7px 14px; border-radius: 999px; }
  h1 { margin: 0; font-size: 50px; line-height: 1; font-weight: 900; letter-spacing: -0.02em; }
  .hook { margin: 0; font-size: 20px; color: #c5c9e4; max-width: 900px; }
  /* phone */
  .phone { width: 960px; height: 540px; border-radius: 34px; position: relative; overflow: hidden; border: 9px solid #05060c; box-shadow: 0 0 0 2px #ffffff26, 0 30px 70px #000a, 0 0 70px color-mix(in srgb, var(--c) 30%, transparent); background: #000; }
  .phone svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud { position: absolute; inset: 0; font-weight: 900; }
  .t { color: #fff; -webkit-text-stroke: 5px #1b1230; paint-order: stroke fill; letter-spacing: .01em; }
  .pills { position: absolute; left: 22px; top: 16px; display: grid; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 6px; min-width: 150px; border-radius: 13px; background: #0b0c1ad9; border: 3px solid #ffffff; box-shadow: 0 4px 0 #0008; font-size: 21px; }
  .pill .ico { width: 28px; height: 28px; border-radius: 50%; flex: none; border: 3px solid #1b1230; }
  .pill .plus { margin-left: auto; width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(#7dff8a, #1fc04a); border: 3px solid #0b3d18; display: grid; place-items: center; font-size: 20px; color: #fff; line-height: 1; }
  .goal { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 360px; text-align: center; padding: 8px 14px 11px; border-radius: 16px; background: #0b0c1ad9; border: 3px solid #fff; box-shadow: 0 4px 0 #0008; }
  .goal b { display: block; font-size: 19px; }
  .goal .bar { height: 14px; border-radius: 99px; background: #1b1230; margin-top: 6px; overflow: hidden; border: 2px solid #fff; }
  .goal .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--c), var(--c2)); }
  .side { position: absolute; left: 22px; top: 150px; display: grid; gap: 10px; }
  .sb { width: 66px; height: 66px; border-radius: 15px; border: 3px solid #1b1230; position: relative; display: grid; place-items: end center; padding-bottom: 3px; font-size: 12.5px; box-shadow: inset 0 3px 0 #ffffff66, 0 5px 0 #0009; }
  .sb svg { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; }
  .sb .dot { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: #ff3b5c; border: 3px solid #fff; }
  .act { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); min-width: 250px; height: 74px; padding: 0 30px; border-radius: 22px; display: grid; place-items: center; font-size: 30px; border: 4px solid #1b1230; background: linear-gradient(#fff3a8, var(--c) 45%, var(--c2)); box-shadow: inset 0 4px 0 #ffffffaa, 0 8px 0 #0009, 0 0 40px color-mix(in srgb, var(--c) 70%, transparent); }
  .act small { position: absolute; bottom: -4px; font-size: 0; }
  .zone { position: absolute; border: 3px dashed #ffffff8c; border-radius: 50%; display: grid; place-items: center; color: #ffffffb3; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .zone.stick { left: 30px; bottom: 18px; width: 118px; height: 118px; display: none; }
  .zone.jump { right: 26px; bottom: 22px; width: 92px; height: 92px; }
  .next { position: absolute; right: 20px; top: 16px; width: 176px; padding: 8px 10px; border-radius: 14px; background: #0b0c1ad9; border: 3px solid #fff; box-shadow: 0 4px 0 #0008; font-size: 13px; text-align: center; }
  .next b { display: block; font-size: 17px; margin-top: 2px; }
  .pop { position: absolute; font-size: 30px; }
  .note { font-size: 14px; color: #9aa0c4; margin: 0; }
  /* right */
  .right { padding: 38px 38px 30px 34px; display: flex; flex-direction: column; gap: 17px; }
  .sec h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--c); }
  .loop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .loop div { background: #ffffff0f; border: 1px solid #ffffff24; border-radius: 13px; padding: 9px 12px; font-size: 16px; line-height: 1.25; }
  .loop div b { display: block; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #a9aecf; margin-bottom: 2px; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 16.5px; color: #dfe2f3; }
  li { padding-left: 20px; position: relative; line-height: 1.3; }
  li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, var(--c), var(--c2)); }
  .slot { border: 2px dashed color-mix(in srgb, var(--c) 80%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: 14px; padding: 11px 14px; font-size: 16.5px; line-height: 1.3; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
  .stats div { background: #ffffff0f; border: 1px solid #ffffff24; border-radius: 13px; padding: 9px 10px; text-align: center; }
  .stats b { display: block; font-size: 22px; font-weight: 900; color: var(--c); }
  .stats span { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #a9aecf; }
  .foot { font-size: 12.5px; color: #8f95ba; margin: 0; }
</style>
</head>
<body>
